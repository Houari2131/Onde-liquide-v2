/* ==================== BOUCLE ==================== */
const Boucle = {
  dernierT: 0,
  temps: 0,
  dernierFreqMaj: 0,

  /** Spectre → State (fréquence dominante, RMS, spread, couleur). */
  analyserAudio(dt) {
    const an = Audio.analyser;
    if (!an) { this.eteindre(dt); return; }
    an.getByteFrequencyData(Analyse.freq);
    an.getByteTimeDomainData(Analyse.temp);
    const taux = Audio.ctx.sampleRate;
    const freqCible = Analyse.frequenceDominante(taux);
    const rms = Analyse.rms();
    const spread = Analyse.etalement(taux);

    if (State.respirer && !State.source) {
      // Respiration automatique : LFO lent quand aucune source n'est active
      this.temps += dt;
      State.level = adoucir(State.level, 0.35 + 0.3 * Math.sin(this.temps * 0.9), 4, dt);
      if (freqCible === 0) {
        const h = (this.temps * 12) % 360;
        State.color = [h, 0.7, 0.9];
        State.frequency = adoucir(State.frequency, 1500 + 900 * Math.sin(this.temps * 0.23), 3, dt);
        State.spread = adoucir(State.spread, 0.4 + 0.25 * Math.sin(this.temps * 0.5), 3, dt);
      }
    } else {
      State.frequency = freqCible > 0 ? adoucir(State.frequency, freqCible, 8, dt) : adoucir(State.frequency, FREQUENCE_MIN, 2, dt);
      State.level = adoucir(State.level, rms, 10, dt);
      State.spread = adoucir(State.spread, spread, 5, dt);
    }

    // Fréquence → tranche → couleur HSV
    if (freqCible > 0) {
      const f = clamp(freqCible, FREQUENCE_MIN, FREQUENCE_MAX);
      for (const t of TRANCHES) {
        if (f >= t.min && f <= t.max) {
          const k = (f - t.min) / (t.max - t.min);
          const i = TRANCHES.indexOf(t);
          const prochaine = TRANCHES[Math.min(i + 1, TRANCHES.length - 1)];
          const melange = i < TRANCHES.length - 1 ? clamp((k - 0.75) / 0.25, 0, 1) : 0;
          State.color = [
            lerp(t.hsv[0], prochaine.hsv[0], melange),
            lerp(t.hsv[1], prochaine.hsv[1], melange),
            lerp(t.hsv[2], prochaine.hsv[2], melange),
          ];
          break;
        }
      }
    }

    // Lissage de la couleur (wrap circulaire sur la teinte)
    const [h, s, v] = State.color;
    let dh = ((h - State.colorLisse[0] + 540) % 360) - 180;
    State.colorLisse[0] = (State.colorLisse[0] + dh * (1 - Math.exp(-6 * dt)) + 360) % 360;
    State.colorLisse[1] = adoucir(State.colorLisse[1], s, 6, dt);
    State.colorLisse[2] = adoucir(State.colorLisse[2], v, 6, dt);
  },

  /** Fondu vers le noir quand tout est silencieux. */
  eteindre(dt) {
    State.level = adoucir(State.level, 0, 3, dt);
    State.spread = adoucir(State.spread, 0, 3, dt);
    State.injection.strength = adoucir(State.injection.strength, 0, 3, dt);
  },

  tick(t) {
    requestAnimationFrame(this.tick.bind(this));
    const dt = clamp((t - this.dernierT) / 1000, 0, 0.05);
    this.dernierT = t;

    if (t - this.dernierFreqMaj > 80) {
      this.dernierFreqMaj = t;
      var f_ = State.frequency;
      document.getElementById('freq-valeur').textContent = f_ > 0 ? Math.round(f_).toLocaleString('fr-FR') : '\u2014';
      var rgb = hsv2rgb(State.colorLisse[0], State.colorLisse[1], State.colorLisse[2]);
      document.getElementById('frequence').style.color = 'rgb(' + ((rgb[0]*255)|0) + ',' + ((rgb[1]*255)|0) + ',' + ((rgb[2]*255)|0) + ')';
    }

    if (!State.geler) {
      this.analyserAudio(dt);
      // Décroissance naturelle de l'injection tactile
      if (State.injection.strength > 0 && !Interactions.pointActif) {
        State.injection.strength = adoucir(State.injection.strength, 0, 4, dt);
      }
      if (window.FluidReady) Fluid.update(State, dt);
    }
    if (window.FluidReady) Fluid.render(State);
  },

  demarrer() {
    this.dernierT = performance.now();
    requestAnimationFrame(this.tick.bind(this));
  },
};

/* Interactions : mémorise si un pointeur est pressé (pour ne pas
   éteindre l'injection pendant le contact). */
Interactions.pointActif = false;

/* ==================== MOTEUR WEBGL 2 — FLUIDE ====================
   Navier-Stokes simplifié sur GPU (approche Pavel Dobryakov) :
   injection → rotationnel → confinement de vorticité → forces de mode
   → divergence → pression (Jacobi) → soustraction du gradient → advection.
   Contrat exposé (défini une seule fois, en fin d'IIFE) :
   Fluid { init, update, render, resize, capture }
   - init(canvas, opts)  : contexte WebGL 2, programmes, FBO
   - update(state, dt)   : injections + un pas de simulation
   - render(state)       : densité → normales → Blinn-Phong + Fresnel
   - resize()            : recalcule les dimensions (DPR plafonné)
   - capture()           : renvoie le canvas pour l'export PNG
   Les fonctions internes s'appellent directement entre elles (jamais
   via l'objet public) pour éviter toute récursion.
   ============================================================ */
(function moteurFluide() {
  window.FluidReady = false;

  /* ---------- Constantes du moteur ---------- */
  const DT_MAX = 1 / 30;                  // pas de temps maximal (onglet réveillé, frame lente)
  const ITERATIONS_PRESSION = 20;         // Jacobi, mode normal
  const ITERATIONS_PRESSION_ECONOME = 10; // Jacobi, mode économe (mobile / GPU lent)
  const DISSIPATION_PRESSION = 0.8;       // la pression de la frame précédente sert d'amorce
  const PLAFOND_DENSITE = 6;              // évite la saturation de la densité
  const RESOLUTION_REF = 256;             // résolution de référence pour l'échelle des vitesses
  const CURL_PAR_MODE = [20, 5, 38, 22, 28]; // Encre, Lave, Nébuleuse, Aurora, Galaxie
  const FOND = [0.006, 0.006, 0.009];     // noir profond (jamais transparent)
  const ATTRIBUTS_CONTEXTE = { alpha: false, antialias: false, premultipliedAlpha: false, preserveDrawingBuffer: true };

  /* ---------- État interne ---------- */
  let canvas = null;
  let gl = null;
  let options = {};
  let econome = false;          // mode économe : moins d'itérations, résolutions plafonnées
  let lineaire = true;          // filtrage linéaire matériel disponible ?
  let formats = null;           // { type, r, rg, rgba } formats flottants rendables
  let quad = null;              // VAO du quad plein écran
  let P = null;                 // programmes compilés
  let velocite = null, densite = null, pression = null; // FBO doubles (ping-pong)
  let divergence = null, rotationnel = null;            // FBO simples
  let resolutionCourante = 0;   // settings.resolution appliquée
  let temps = 0;                // temps de simulation (s)
  let dtMoyen = 1 / 60, dureeLente = 0;                 // surveillance des performances
  let precX = 0.5, precY = 0.5, precForce = 0;          // injection de la frame précédente
  let dernierEtat = null;
  let ecouteursPoses = false;

  const clamp01 = v => Math.min(1, Math.max(0, v || 0));

  /* =================== 1. SHADERS =================== */

  // En-tête des fragment shaders : GLSL ES 3.00, précision haute,
  // + FILTRAGE_MANUEL si les textures flottantes ne sont pas filtrables.
  const enteteFragment = () =>
    '#version 300 es\nprecision highp float;\nprecision highp sampler2D;\n' +
    (lineaire ? '' : '#define FILTRAGE_MANUEL\n');

  // Vertex shader commun : quad plein écran + coordonnées des voisins
  const SOURCE_VERTEX = `#version 300 es
precision highp float;
layout(location = 0) in vec2 aPosition;
uniform vec2 texelSize;
out vec2 vUv;
out vec2 vL;
out vec2 vR;
out vec2 vT;
out vec2 vB;
void main () {
  vUv = aPosition * 0.5 + 0.5;
  vL = vUv - vec2(texelSize.x, 0.0);
  vR = vUv + vec2(texelSize.x, 0.0);
  vT = vUv + vec2(0.0, texelSize.y);
  vB = vUv - vec2(0.0, texelSize.y);
  gl_Position = vec4(aPosition, 0.0, 1.0);
}`;

  // Échantillonnage : matériel si possible, sinon interpolation bilinéaire manuelle
  const GLSL_ECHANTILLON = `
vec4 echantillon (sampler2D tex, vec2 uv, vec2 texel) {
#ifdef FILTRAGE_MANUEL
  vec2 st = uv / texel - 0.5;
  vec2 i = floor(st);
  vec2 f = fract(st);
  vec4 a = texture(tex, (i + vec2(0.5, 0.5)) * texel);
  vec4 b = texture(tex, (i + vec2(1.5, 0.5)) * texel);
  vec4 c = texture(tex, (i + vec2(0.5, 1.5)) * texel);
  vec4 d = texture(tex, (i + vec2(1.5, 1.5)) * texel);
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
#else
  return texture(tex, uv);
#endif
}
`;

  // Copie (rééchantillonnage lors d'un changement de résolution)
  const FS_COPIE = `
in vec2 vUv;
uniform sampler2D uTexture;
uniform vec2 uTexelSource;
out vec4 fragColor;
void main () {
  fragColor = echantillon(uTexture, vUv, uTexelSource);
}`;

  // Dissipation : multiplie un champ par un facteur (amorce de la pression)
  const FS_DISSIPATION = `
in vec2 vUv;
uniform sampler2D uTexture;
uniform float uValeur;
out vec4 fragColor;
void main () {
  fragColor = uValeur * texture(uTexture, vUv);
}`;

  // Injection : ajoute une couleur (ou une vitesse) pondérée par un noyau gaussien
  const FS_INJECTION = `
in vec2 vUv;
uniform sampler2D uCible;
uniform float uAspect;
uniform vec2 uPoint;
uniform vec4 uCouleur;
uniform float uRayon;
uniform float uPlafond;
out vec4 fragColor;
void main () {
  vec2 p = vUv - uPoint;
  p.x *= uAspect;                          // distance isotrope à l'écran
  float g = exp(-dot(p, p) / uRayon);      // noyau gaussien
  vec4 base = texture(uCible, vUv);
  fragColor = clamp(base + uCouleur * g, -uPlafond, uPlafond);
}`;

  // Advection semi-lagrangienne : on remonte le courant puis on échantillonne
  const FS_ADVECTION = `
in vec2 vUv;
uniform sampler2D uVelocite;
uniform sampler2D uSource;
uniform vec2 texelSize;
uniform vec2 uTexelSource;
uniform float dt;
uniform float uDissipation;
out vec4 fragColor;
void main () {
  vec2 coord = vUv - dt * echantillon(uVelocite, vUv, texelSize).xy * texelSize;
  vec4 resultat = echantillon(uSource, coord, uTexelSource);
  fragColor = resultat / (1.0 + uDissipation * dt);
}`;

  // Divergence du champ de vitesse (parois réfléchissantes sur les bords)
  const FS_DIVERGENCE = `
in vec2 vUv;
in vec2 vL;
in vec2 vR;
in vec2 vT;
in vec2 vB;
uniform sampler2D uVelocite;
out vec4 fragColor;
void main () {
  float L = texture(uVelocite, vL).x;
  float R = texture(uVelocite, vR).x;
  float T = texture(uVelocite, vT).y;
  float B = texture(uVelocite, vB).y;
  vec2 C = texture(uVelocite, vUv).xy;
  if (vL.x < 0.0) { L = -C.x; }
  if (vR.x > 1.0) { R = -C.x; }
  if (vT.y > 1.0) { T = -C.y; }
  if (vB.y < 0.0) { B = -C.y; }
  float div = 0.5 * (R - L + T - B);
  fragColor = vec4(div, 0.0, 0.0, 1.0);
}`;

  // Rotationnel (composante z du curl 2D)
  const FS_ROTATIONNEL = `
in vec2 vUv;
in vec2 vL;
in vec2 vR;
in vec2 vT;
in vec2 vB;
uniform sampler2D uVelocite;
out vec4 fragColor;
void main () {
  float L = texture(uVelocite, vL).y;
  float R = texture(uVelocite, vR).y;
  float T = texture(uVelocite, vT).x;
  float B = texture(uVelocite, vB).x;
  fragColor = vec4(0.5 * (R - L - T + B), 0.0, 0.0, 1.0);
}`;

  // Confinement de vorticité : réinjecte l'énergie des petits tourbillons
  const FS_VORTICITE = `
in vec2 vUv;
in vec2 vL;
in vec2 vR;
in vec2 vT;
in vec2 vB;
uniform sampler2D uVelocite;
uniform sampler2D uRotationnel;
uniform float uCurl;
uniform float dt;
out vec4 fragColor;
void main () {
  float L = texture(uRotationnel, vL).x;
  float R = texture(uRotationnel, vR).x;
  float T = texture(uRotationnel, vT).x;
  float B = texture(uRotationnel, vB).x;
  float C = texture(uRotationnel, vUv).x;
  vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
  force /= length(force) + 0.0001;
  force *= uCurl * C;
  force.y *= -1.0;
  vec2 v = texture(uVelocite, vUv).xy + force * dt;
  v = clamp(v, -1000.0, 1000.0);
  fragColor = vec4(v, 0.0, 1.0);
}`;

  // Forces propres à chaque mode (Lave, Nébuleuse, Aurora, Galaxie)
  const FS_FORCES = `
in vec2 vUv;
uniform sampler2D uVelocite;
uniform sampler2D uDensite;
uniform int uMode;
uniform float uTemps;
uniform float dt;
uniform float uAspect;
uniform float uEchelle;
uniform float uIntensite;
out vec4 fragColor;
void main () {
  vec2 v = texture(uVelocite, vUv).xy;
  float d = texture(uDensite, vUv).a;
  vec2 p = (vUv - 0.5) * vec2(uAspect, 1.0);
  vec2 f = vec2(0.0);
  if (uMode == 1) {
    // Lave : poussée d'Archimède, la matière dense et chaude monte
    f.y += min(d, 3.0) * 45.0;
  } else if (uMode == 2) {
    // Nébuleuse : turbulence lente par champ sinusoïdal
    f += vec2(sin(vUv.y * 13.0 + uTemps * 0.7), cos(vUv.x * 11.0 - uTemps * 0.55)) * 22.0;
  } else if (uMode == 3) {
    // Aurora : vent horizontal en bandes + légère ascension
    f.x += sin(vUv.y * 9.0 + uTemps * 0.6) * 34.0;
    f.y += 8.0 * min(d, 2.0);
  } else if (uMode == 4) {
    // Galaxie : rotation différentielle autour du centre + aspiration douce
    float r = length(p);
    vec2 t = vec2(-p.y, p.x) / (r + 0.12);
    f += (t * 70.0 - p * 35.0) * smoothstep(0.95, 0.05, r);
  }
  fragColor = vec4(v + f * uEchelle * uIntensite * dt, 0.0, 1.0);
}`;

  // Pression : une itération de Jacobi
  const FS_PRESSION = `
in vec2 vUv;
in vec2 vL;
in vec2 vR;
in vec2 vT;
in vec2 vB;
uniform sampler2D uPression;
uniform sampler2D uDivergence;
out vec4 fragColor;
void main () {
  float L = texture(uPression, vL).x;
  float R = texture(uPression, vR).x;
  float T = texture(uPression, vT).x;
  float B = texture(uPression, vB).x;
  float div = texture(uDivergence, vUv).x;
  fragColor = vec4((L + R + B + T - div) * 0.25, 0.0, 0.0, 1.0);
}`;

  // Soustraction du gradient de pression : rend le champ incompressible
  const FS_GRADIENT = `
in vec2 vUv;
in vec2 vL;
in vec2 vR;
in vec2 vT;
in vec2 vB;
uniform sampler2D uPression;
uniform sampler2D uVelocite;
out vec4 fragColor;
void main () {
  float L = texture(uPression, vL).x;
  float R = texture(uPression, vR).x;
  float T = texture(uPression, vT).x;
  float B = texture(uPression, vB).x;
  vec2 v = texture(uVelocite, vUv).xy - vec2(R - L, T - B);
  fragColor = vec4(v, 0.0, 1.0);
}`;

  // Rendu final : densité → hauteur → normales → Blinn-Phong + Fresnel
  const FS_AFFICHAGE = `
in vec2 vUv;
uniform sampler2D uDensite;
uniform vec2 texelSize;
uniform float uTemps;
uniform float uBruit;
uniform float uGrain;
uniform float uVignette;
uniform float uSymetrie;
uniform float uRelief;
uniform float uAspect;
uniform int uMode;
out vec4 fragColor;

// Conversions RGB ↔ HSV (teinte 0–1)
vec3 rgbVersHsv (vec3 c) {
  vec4 K = vec4(0.0, -1.0 / 3.0, 2.0 / 3.0, -1.0);
  vec4 p = mix(vec4(c.bg, K.wz), vec4(c.gb, K.xy), step(c.b, c.g));
  vec4 q = mix(vec4(p.xyw, c.r), vec4(c.r, p.yzx), step(p.x, c.r));
  float d = q.x - min(q.w, q.y);
  return vec3(abs(q.z + (q.w - q.y) / (6.0 * d + 1e-10)), d / (q.x + 1e-10), q.x);
}
vec3 hsvVersRgb (vec3 c) {
  vec3 p = abs(fract(c.xxx + vec3(1.0, 2.0 / 3.0, 1.0 / 3.0)) * 6.0 - 3.0);
  return c.z * mix(vec3(1.0), clamp(p - 1.0, 0.0, 1.0), c.y);
}

// Bruit pseudo-aléatoire par pixel
float hachage (vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}

// Symétrie miroir : repli de la moitié droite sur la moitié gauche
vec2 replier (vec2 uv) {
  if (uSymetrie > 0.5) { uv.x = 0.5 - abs(uv.x - 0.5); }
  return uv;
}

// Hauteur de la surface liquide (densité saturée en douceur)
float hauteur (vec2 uv) {
  return 1.0 - exp(-1.4 * max(echantillon(uDensite, replier(uv), texelSize).a, 0.0));
}

void main () {
  vec4 d = echantillon(uDensite, replier(vUv), texelSize);
  float a = max(d.a, 0.0);
  float h = 1.0 - exp(-1.4 * a);
  vec3 base = clamp(d.rgb / max(a, 1e-4), 0.0, 1.0);   // couleur moyenne injectée

  // Normales par différences finies, calculées en espace écran (miroir compris)
  vec2 e = texelSize * 1.5;
  float hL = hauteur(vUv - vec2(e.x, 0.0));
  float hR = hauteur(vUv + vec2(e.x, 0.0));
  float hB = hauteur(vUv - vec2(0.0, e.y));
  float hT = hauteur(vUv + vec2(0.0, e.y));
  vec3 n = normalize(vec3((hL - hR) * uRelief, (hB - hT) * uRelief, 1.0));

  // Palette selon le mode
  vec3 hsv = rgbVersHsv(base);
  vec3 emissif = vec3(0.0);
  float brillance = 1.0;
  vec3 fond = vec3(${FOND.join(', ')});
  if (uMode == 1) {
    // Lave : cœur incandescent, croûte sombre sur les bords
    hsv.x -= 0.03 * h;
    base = hsvVersRgb(hsv);
    base = mix(base * 0.35, mix(base, vec3(1.0, 0.82, 0.45), 0.55), smoothstep(0.35, 0.95, h));
    emissif = base * smoothstep(0.55, 1.0, h) * 0.45;
    brillance = 0.5;
  } else if (uMode == 2) {
    // Nébuleuse : la teinte dérive avec la densité, lueur diffuse
    hsv.x += (h - 0.5) * 0.18;
    hsv.y *= 0.85;
    base = hsvVersRgb(hsv);
    emissif = base * h * 0.35;
    brillance = 0.35;
  } else if (uMode == 3) {
    // Aurora : dégradé vertical de teinte + rideaux lumineux
    hsv.x += (vUv.y - 0.4) * 0.22;
    base = hsvVersRgb(hsv);
    float rideau = 0.75 + 0.25 * sin(vUv.x * 38.0 + uTemps * 0.8 + h * 6.0);
    base *= rideau;
    emissif = base * h * 0.3;
    brillance = 0.6;
  } else if (uMode == 4) {
    // Galaxie : la teinte tourne avec l'angle, étoiles en fond
    vec2 q = (vUv - 0.5) * vec2(uAspect, 1.0);
    // sin(2·angle) : variation continue, sans couture au passage ±π d'atan
    hsv.x += 0.08 * sin(2.0 * atan(q.y, q.x) + uTemps * 0.3) + length(q) * 0.15;
    base = hsvVersRgb(hsv);
    emissif = base * h * 0.25;
    brillance = 0.8;
    float etoile = hachage(floor(gl_FragCoord.xy / 2.0));
    fond += vec3(0.5, 0.55, 0.7) * step(0.9993, etoile) * (0.35 + 0.35 * sin(uBruit * 3.0 + etoile * 100.0));
  }

  // Éclairage Blinn-Phong + Fresnel (Schlick, F0 de l'eau ≈ 0.04)
  vec3 L = normalize(vec3(-0.45, 0.6, 0.75));
  vec3 V = vec3(0.0, 0.0, 1.0);
  vec3 H = normalize(L + V);
  float diffus = max(dot(n, L), 0.0);
  float speculaire = pow(max(dot(n, H), 0.0), 90.0);
  float fresnel = 0.04 + 0.96 * pow(1.0 - max(dot(n, V), 0.0), 5.0);
  vec3 corps = base * (0.28 + 0.9 * diffus) + emissif;
  vec3 couleur = mix(fond, corps, h);
  float mouille = smoothstep(0.03, 0.25, h);
  vec3 ciel = mix(vec3(0.10, 0.10, 0.12), base, 0.3);   // reflet d'environnement
  couleur += mouille * (speculaire * 0.9 * brillance * vec3(1.0, 0.97, 0.9) + fresnel * ciel * 1.2);

  // Grain de film
  float g = hachage(gl_FragCoord.xy + fract(uBruit * 7.13) * 917.0) - 0.5;
  couleur += g * uGrain * 0.07;

  // Vignette
  float r = length(vUv - 0.5) * 1.4142;
  couleur *= 1.0 - uVignette * 0.75 * smoothstep(0.35, 1.0, r);

  fragColor = vec4(clamp(couleur, 0.0, 1.0), 1.0);   // toujours opaque
}`;

  /* =================== 2. PROGRAMMES =================== */

  function compiler(type, source) {
    const s = gl.createShader(type);
    gl.shaderSource(s, source);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      const journal = gl.getShaderInfoLog(s);
      gl.deleteShader(s);
      throw new Error('compilation du shader : ' + journal);
    }
    return s;
  }

  /** Lie un programme et indexe ses uniformes actifs par nom. */
  function creerProgramme(vs, corpsFragment) {
    const programme = gl.createProgram();
    gl.attachShader(programme, vs);
    gl.attachShader(programme, compiler(gl.FRAGMENT_SHADER, enteteFragment() + GLSL_ECHANTILLON + corpsFragment));
    gl.linkProgram(programme);
    if (!gl.getProgramParameter(programme, gl.LINK_STATUS)) {
      throw new Error('édition de liens : ' + gl.getProgramInfoLog(programme));
    }
    const u = {};
    const n = gl.getProgramParameter(programme, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) {
      const nom = gl.getActiveUniform(programme, i).name;
      u[nom] = gl.getUniformLocation(programme, nom);
    }
    return { programme, u };
  }

  function creerProgrammes() {
    const vs = compiler(gl.VERTEX_SHADER, SOURCE_VERTEX);
    P = {
      copie:        creerProgramme(vs, FS_COPIE),
      dissipation:  creerProgramme(vs, FS_DISSIPATION),
      injection:    creerProgramme(vs, FS_INJECTION),
      advection:    creerProgramme(vs, FS_ADVECTION),
      divergence:   creerProgramme(vs, FS_DIVERGENCE),
      rotationnel:  creerProgramme(vs, FS_ROTATIONNEL),
      vorticite:    creerProgramme(vs, FS_VORTICITE),
      forces:       creerProgramme(vs, FS_FORCES),
      pression:     creerProgramme(vs, FS_PRESSION),
      gradient:     creerProgramme(vs, FS_GRADIENT),
      affichage:    creerProgramme(vs, FS_AFFICHAGE),
    };
  }

  /** Active un programme et renvoie sa table d'uniformes. */
  function utiliser(prog) {
    gl.useProgram(prog.programme);
    return prog.u;
  }

  /** Quad plein écran (2 triangles) dans un VAO. */
  function creerQuad() {
    quad = gl.createVertexArray();
    gl.bindVertexArray(quad);
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, -1, 1, 1, 1, 1, -1]), gl.STATIC_DRAW);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array([0, 1, 2, 0, 2, 3]), gl.STATIC_DRAW);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    gl.enableVertexAttribArray(0);
  }

  /** Dessine le quad dans une cible (FBO) ou à l'écran si cible = null. */
  function dessiner(cible) {
    if (cible) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, cible.fbo);
      gl.viewport(0, 0, cible.largeur, cible.hauteur);
    } else {
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
    }
    gl.bindVertexArray(quad);
    gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0);
  }

  /* =================== 3. FBO =================== */

  /** Teste si un format de texture flottante est utilisable comme cible de rendu. */
  function formatRendable(interne, format, type) {
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texImage2D(gl.TEXTURE_2D, 0, interne, 4, 4, 0, format, type, null);
    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.deleteFramebuffer(fbo);
    gl.deleteTexture(tex);
    return ok;
  }

  /**
   * Choisit les formats : float 32 si EXT_color_buffer_float, sinon half float.
   * Float 32 : filtrage linéaire seulement avec OES_texture_float_linear.
   * Half float : filtrable nativement en WebGL 2 (OpenGL ES 3.0).
   * Repli R → RG → RGBA si un format à moins de canaux n'est pas rendable.
   */
  function detecterFormats() {
    const extFloat = gl.getExtension('EXT_color_buffer_float');
    const extLineaire = gl.getExtension('OES_texture_float_linear');
    const essais = [];
    if (extFloat) {
      essais.push({ type: gl.FLOAT, lineaire: !!extLineaire,
        r: [gl.R32F, gl.RED], rg: [gl.RG32F, gl.RG], rgba: [gl.RGBA32F, gl.RGBA] });
    }
    if (extFloat || gl.getExtension('EXT_color_buffer_half_float')) {
      essais.push({ type: gl.HALF_FLOAT, lineaire: true,
        r: [gl.R16F, gl.RED], rg: [gl.RG16F, gl.RG], rgba: [gl.RGBA16F, gl.RGBA] });
    }
    for (const e of essais) {
      const choisir = liste => {
        const f = liste.find(([interne, format]) => formatRendable(interne, format, e.type));
        return f ? { interne: f[0], format: f[1] } : null;
      };
      const rgba = choisir([e.rgba]);
      const rg = choisir([e.rg, e.rgba]);
      const r = choisir([e.r, e.rg, e.rgba]);
      if (rgba && rg && r) return { type: e.type, lineaire: e.lineaire, r, rg, rgba };
    }
    return null;
  }

  function creerFBO(largeur, hauteur, fmt, filtre) {
    gl.activeTexture(gl.TEXTURE0);
    const texture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filtre);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filtre);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, fmt.interne, largeur, hauteur, 0, fmt.format, formats.type, null);
    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
    gl.viewport(0, 0, largeur, hauteur);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    return {
      texture, fbo, largeur, hauteur,
      texel: [1 / largeur, 1 / hauteur],
      /** Lie la texture sur une unité et renvoie l'indice de l'unité. */
      attacher(unite) {
        gl.activeTexture(gl.TEXTURE0 + unite);
        gl.bindTexture(gl.TEXTURE_2D, texture);
        return unite;
      },
    };
  }

  /** Paire de FBO pour le ping-pong lecture / écriture. */
  function creerDoubleFBO(largeur, hauteur, fmt, filtre) {
    return {
      largeur, hauteur,
      texel: [1 / largeur, 1 / hauteur],
      lecture: creerFBO(largeur, hauteur, fmt, filtre),
      ecriture: creerFBO(largeur, hauteur, fmt, filtre),
      echanger() { const t = this.lecture; this.lecture = this.ecriture; this.ecriture = t; },
    };
  }

  function libererFBO(f) {
    if (!f) return;
    gl.deleteTexture(f.texture);
    gl.deleteFramebuffer(f.fbo);
  }

  function libererDouble(d) {
    if (!d) return;
    libererFBO(d.lecture);
    libererFBO(d.ecriture);
  }

  /** Redimensionne un FBO double en conservant son contenu (rééchantillonné). */
  function redimensionnerDouble(ancien, largeur, hauteur, fmt, filtre) {
    if (ancien && ancien.largeur === largeur && ancien.hauteur === hauteur) return ancien;
    const nouveau = creerDoubleFBO(largeur, hauteur, fmt, filtre);
    if (ancien) {
      const u = utiliser(P.copie);
      gl.uniform2f(u.texelSize, nouveau.texel[0], nouveau.texel[1]);
      gl.uniform2f(u.uTexelSource, ancien.texel[0], ancien.texel[1]);
      gl.uniform1i(u.uTexture, ancien.lecture.attacher(0));
      dessiner(nouveau.lecture);
      libererDouble(ancien);
    }
    return nouveau;
  }

  /** Dimensions d'une grille : le petit côté vaut `res`, le grand suit le ratio. */
  function grillePour(res) {
    const l = gl.drawingBufferWidth, h = gl.drawingBufferHeight;
    const maxTex = gl.getParameter(gl.MAX_TEXTURE_SIZE);
    const ratio = Math.max(l, h) / Math.max(1, Math.min(l, h));
    const petit = Math.max(16, Math.round(res));
    const grand = Math.min(maxTex, Math.round(petit * ratio));
    return l >= h ? { l: grand, h: petit } : { l: petit, h: grand };
  }

  /** (Re)crée tous les champs pour une résolution de simulation donnée. */
  function initFBOs(resolution) {
    const res = econome ? Math.min(resolution, 256) : resolution;
    const sim = grillePour(res);
    const teinture = grillePour(Math.min(res * 2, econome ? 512 : 1024));
    const filtre = lineaire ? gl.LINEAR : gl.NEAREST;
    gl.disable(gl.BLEND);
    velocite = redimensionnerDouble(velocite, sim.l, sim.h, formats.rg, filtre);
    densite = redimensionnerDouble(densite, teinture.l, teinture.h, formats.rgba, filtre);
    // Champs auxiliaires : recalculés à chaque pas, inutile de les conserver
    libererDouble(pression);
    libererFBO(divergence);
    libererFBO(rotationnel);
    pression = creerDoubleFBO(sim.l, sim.h, formats.r, gl.NEAREST);
    divergence = creerFBO(sim.l, sim.h, formats.r, gl.NEAREST);
    rotationnel = creerFBO(sim.l, sim.h, formats.r, gl.NEAREST);
    resolutionCourante = resolution;
  }

  /* =================== 4. SIMULATION =================== */

  /** Couleur d'injection : colorLisse, complémentaire si le spectre est étalé, légère dérive. */
  function couleurInjection(state) {
    const c = state.colorLisse || [36, 0.82, 0.95];
    let h = c[0];
    if ((state.spread || 0) > 0.3) h += 180;                     // teinte complémentaire
    const vitesseTeinte = 0.15 + clamp01(state.settings.rapidite / 100) * 1.6;
    h += 18 * Math.sin(temps * vitesseTeinte);                   // « vitesse de teinte »
    return hsv2rgb(h, c[1], c[2]);
  }

  /** Ajoute vitesse (vx, vy en texels/s) et densité colorée autour de (x, y). */
  function injecter(x, y, vx, vy, rgb, quantite, rayon) {
    const aspect = canvas.width / canvas.height;
    const r = rayon * Math.min(1, aspect);   // rayon exprimé en fraction du petit côté
    let u = utiliser(P.injection);
    gl.uniform2f(u.texelSize, velocite.texel[0], velocite.texel[1]);
    gl.uniform1f(u.uAspect, aspect);
    gl.uniform2f(u.uPoint, x, y);
    gl.uniform1f(u.uRayon, r * r);
    // Vitesse
    gl.uniform1i(u.uCible, velocite.lecture.attacher(0));
    gl.uniform4f(u.uCouleur, vx, vy, 0, 0);
    gl.uniform1f(u.uPlafond, 1e4);
    dessiner(velocite.ecriture);
    velocite.echanger();
    // Densité (couleur prémultipliée, quantité dans l'alpha)
    if (quantite > 0) {
      u = utiliser(P.injection);
      gl.uniform2f(u.texelSize, densite.texel[0], densite.texel[1]);
      gl.uniform1i(u.uCible, densite.lecture.attacher(0));
      gl.uniform4f(u.uCouleur, rgb[0] * quantite, rgb[1] * quantite, rgb[2] * quantite, quantite);
      gl.uniform1f(u.uPlafond, PLAFOND_DENSITE);
      dessiner(densite.ecriture);
      densite.echanger();
    }
  }

  /** Injection avec copie miroir si la symétrie est active. */
  function injecterSym(state, x, y, vx, vy, rgb, quantite, rayon) {
    injecter(x, y, vx, vy, rgb, quantite, rayon);
    if (state.settings.symetrie) injecter(1 - x, y, -vx, vy, rgb, quantite, rayon);
  }

  /** Traduit le state (pointeur, audio, spectre) en injections. */
  function appliquerInjections(state, dt) {
    const s = state.settings;
    const force = clamp01(s.force / 100);
    const ampli = clamp01(s.amplitude / 100);
    const level = clamp01(state.level);
    const freq = Math.max(state.frequency || 0, 60);
    const rayon = 1.1 / Math.sqrt(freq);                // aigu = point précis, grave = grosse tache
    const parUv = Math.min(velocite.largeur, velocite.hauteur); // texels par petit côté
    const k = dt * 60;                                  // normalisation à 60 images/s
    const rgb = couleurInjection(state);

    // 1) Pointeur / clavier / molette : force ∝ strength, modulée par level
    const inj = state.injection || {};
    const ix = clamp01(inj.x === undefined ? 0.5 : inj.x);
    const iy = clamp01(inj.y === undefined ? 0.5 : inj.y);   // déjà en origine bas-gauche
    const is = clamp01(inj.strength);
    if (is > 0.01) {
      if (precForce <= 0.01) { precX = ix; precY = iy; }     // nouveau contact : pas de saut
      const intensite = is * (0.5 + level);
      let vx = (ix - precX) / dt * velocite.largeur * 1.5;
      let vy = (iy - precY) / dt * velocite.hauteur * 1.5;
      if (Math.hypot(vx, vy) < 1) {
        // Pointeur immobile : impulsion dont la direction tourne lentement
        const angle = temps * 2.3;
        vx = Math.cos(angle) * 0.25 * parUv;
        vy = Math.sin(angle) * 0.25 * parUv;
      }
      const m = Math.hypot(vx, vy), plafond = 3 * parUv;
      if (m > plafond) { vx *= plafond / m; vy *= plafond / m; }
      injecterSym(state, ix, iy, vx * force * intensite, vy * force * intensite,
        rgb, 0.35 * intensite * k, rayon * (1 + 0.5 * is));
    }
    precX = ix; precY = iy; precForce = is;

    // 2) Audio : émetteur errant, hauteur à l'écran ~ log(fréquence)
    if (level > 0.015) {
      const nf = clamp01(Math.log2(freq / 400) / Math.log2(9000 / 400)); // 0 grave → 1 aigu
      const ex = 0.5 + 0.3 * Math.sin(temps * 0.31) * Math.cos(temps * 0.17);
      const ey = 0.2 + 0.6 * nf + 0.05 * Math.sin(temps * 0.9);
      const angle = temps * (0.6 + nf) + 2 * Math.sin(temps * 0.23);
      const v = 1.2 * level * (0.3 + ampli) * (0.3 + force) * parUv * k;
      injecterSym(state, ex, ey, Math.cos(angle) * v, Math.sin(angle) * v,
        rgb, 0.6 * level * (0.3 + ampli) * k, rayon);
    }

    // 3) Spectre étalé (pluie, bruit) : gouttelettes aléatoires
    const spread = clamp01(state.spread);
    if (spread > 0.3 && Math.random() < spread * level * k * 0.8) {
      const gx = 0.1 + Math.random() * 0.8, gy = 0.15 + Math.random() * 0.75;
      const a = Math.random() * Math.PI * 2;
      const v = 0.4 * (0.3 + force) * parUv;
      injecterSym(state, gx, gy, Math.cos(a) * v, Math.sin(a) * v,
        rgb, 2 * level * (0.3 + ampli), rayon * 0.7);
    }
  }

  /** Un pas de Navier-Stokes simplifié. */
  function pas(state, dt) {
    const s = state.settings;
    const visc = clamp01(s.viscosite / 100);
    const mode = Math.min(4, Math.max(0, state.mode | 0));
    const tx = velocite.texel;
    gl.disable(gl.BLEND);

    // Rotationnel
    let u = utiliser(P.rotationnel);
    gl.uniform2f(u.texelSize, tx[0], tx[1]);
    gl.uniform1i(u.uVelocite, velocite.lecture.attacher(0));
    dessiner(rotationnel);

    // Confinement de vorticité
    u = utiliser(P.vorticite);
    gl.uniform2f(u.texelSize, tx[0], tx[1]);
    gl.uniform1i(u.uVelocite, velocite.lecture.attacher(0));
    gl.uniform1i(u.uRotationnel, rotationnel.attacher(1));
    gl.uniform1f(u.uCurl, CURL_PAR_MODE[mode] * (0.5 + clamp01(s.amplitude / 100)));
    gl.uniform1f(u.dt, dt);
    dessiner(velocite.ecriture);
    velocite.echanger();

    // Forces de mode (Encre = aucune)
    if (mode !== 0) {
      u = utiliser(P.forces);
      gl.uniform2f(u.texelSize, tx[0], tx[1]);
      gl.uniform1i(u.uVelocite, velocite.lecture.attacher(0));
      gl.uniform1i(u.uDensite, densite.lecture.attacher(1));
      gl.uniform1i(u.uMode, mode);
      gl.uniform1f(u.uTemps, temps);
      gl.uniform1f(u.dt, dt);
      gl.uniform1f(u.uAspect, canvas.width / canvas.height);
      gl.uniform1f(u.uEchelle, Math.min(velocite.largeur, velocite.hauteur) / RESOLUTION_REF);
      gl.uniform1f(u.uIntensite, 0.4 + clamp01(state.level) * 1.2);
      dessiner(velocite.ecriture);
      velocite.echanger();
    }

    // Divergence
    u = utiliser(P.divergence);
    gl.uniform2f(u.texelSize, tx[0], tx[1]);
    gl.uniform1i(u.uVelocite, velocite.lecture.attacher(0));
    dessiner(divergence);

    // Pression : amorce atténuée puis itérations de Jacobi
    u = utiliser(P.dissipation);
    gl.uniform2f(u.texelSize, tx[0], tx[1]);
    gl.uniform1i(u.uTexture, pression.lecture.attacher(0));
    gl.uniform1f(u.uValeur, DISSIPATION_PRESSION);
    dessiner(pression.ecriture);
    pression.echanger();

    u = utiliser(P.pression);
    gl.uniform2f(u.texelSize, tx[0], tx[1]);
    gl.uniform1i(u.uDivergence, divergence.attacher(0));
    const iterations = econome ? ITERATIONS_PRESSION_ECONOME : ITERATIONS_PRESSION;
    for (let i = 0; i < iterations; i++) {
      gl.uniform1i(u.uPression, pression.lecture.attacher(1));
      dessiner(pression.ecriture);
      pression.echanger();
    }

    // Soustraction du gradient
    u = utiliser(P.gradient);
    gl.uniform2f(u.texelSize, tx[0], tx[1]);
    gl.uniform1i(u.uPression, pression.lecture.attacher(0));
    gl.uniform1i(u.uVelocite, velocite.lecture.attacher(1));
    dessiner(velocite.ecriture);
    velocite.echanger();

    // Advection de la vitesse (dissipation ↑ avec la viscosité)
    u = utiliser(P.advection);
    gl.uniform2f(u.texelSize, tx[0], tx[1]);
    gl.uniform2f(u.uTexelSource, tx[0], tx[1]);
    gl.uniform1i(u.uVelocite, velocite.lecture.attacher(0));
    gl.uniform1i(u.uSource, velocite.lecture.attacher(0));
    gl.uniform1f(u.dt, dt);
    gl.uniform1f(u.uDissipation, 0.08 + visc * 2.2);
    dessiner(velocite.ecriture);
    velocite.echanger();

    // Advection de la densité (un fluide visqueux garde sa matière plus longtemps)
    gl.uniform2f(u.uTexelSource, densite.texel[0], densite.texel[1]);
    gl.uniform1i(u.uVelocite, velocite.lecture.attacher(0));
    gl.uniform1i(u.uSource, densite.lecture.attacher(1));
    gl.uniform1f(u.uDissipation, 0.15 + (1 - visc) * 0.7);
    dessiner(densite.ecriture);
    densite.echanger();
  }

  /** Passe en mode économe si les frames restent lentes plusieurs secondes. */
  function surveillerPerf(dtBrut) {
    if (econome) return;
    dtMoyen += (dtBrut - dtMoyen) * 0.05;
    dureeLente = dtMoyen > 1 / 38 ? dureeLente + dtBrut : 0;
    if (dureeLente > 4) {
      econome = true;
      resize();
      initFBOs(resolutionCourante);
    }
  }

  function update(state, dt) {
    if (!window.FluidReady || !state || !state.settings) return;
    dernierEtat = state;
    const dtBrut = Math.max(0, Number(dt) || 0);
    if (dtBrut <= 0) return;
    const pasTemps = Math.min(dtBrut, DT_MAX);         // dt clampé : pas d'explosion au réveil
    surveillerPerf(dtBrut);
    const resVoulue = Math.min(512, Math.max(64, Number(state.settings.resolution) || 256));
    if (resVoulue !== resolutionCourante) initFBOs(resVoulue);
    temps += pasTemps;
    appliquerInjections(state, pasTemps);
    pas(state, pasTemps);
  }

  /* =================== 5. RENDU =================== */

  function render(state) {
    if (!window.FluidReady) return;
    const etat = state || dernierEtat;
    if (!etat || !etat.settings) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.clearColor(FOND[0], FOND[1], FOND[2], 1);
      gl.clear(gl.COLOR_BUFFER_BIT);
      return;
    }
    dernierEtat = etat;
    const s = etat.settings;
    gl.disable(gl.BLEND);
    const u = utiliser(P.affichage);
    gl.uniform2f(u.texelSize, densite.texel[0], densite.texel[1]);
    gl.uniform1i(u.uDensite, densite.lecture.attacher(0));
    gl.uniform1f(u.uTemps, temps);
    gl.uniform1f(u.uBruit, (performance.now() / 1000) % 1000);
    gl.uniform1f(u.uGrain, clamp01(s.grain / 100));
    gl.uniform1f(u.uVignette, clamp01(s.vignette / 100));
    gl.uniform1f(u.uSymetrie, s.symetrie ? 1 : 0);
    gl.uniform1f(u.uRelief, 4 + 10 * clamp01(s.amplitude / 100));
    gl.uniform1f(u.uAspect, canvas.width / canvas.height);
    gl.uniform1i(u.uMode, Math.min(4, Math.max(0, etat.mode | 0)));
    dessiner(null);
  }

  /** Taille du canvas = taille CSS × DPR plafonné (plus bas en mode économe). */
  function resize() {
    if (!canvas) return;
    const plafond = Math.min(options.dprMax || 2, econome ? 1.5 : 2);
    const dpr = Math.min(window.devicePixelRatio || 1, plafond);
    const largeur = Math.max(1, Math.floor((canvas.clientWidth || window.innerWidth) * dpr));
    const hauteur = Math.max(1, Math.floor((canvas.clientHeight || window.innerHeight) * dpr));
    if (canvas.width !== largeur || canvas.height !== hauteur) {
      canvas.width = largeur;
      canvas.height = hauteur;
      if (window.FluidReady) initFBOs(resolutionCourante || 256);
    }
  }

  function capture() {
    if (window.FluidReady && dernierEtat) render(dernierEtat);   // frame fraîche avant export
    return canvas || document.getElementById('scene');
  }

  /* =================== 6. INITIALISATION & API PUBLIQUE =================== */

  function detecterEconome() {
    if (typeof options.econome === 'boolean') return options.econome;
    const tactile = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
    return tactile || /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent || '');
  }

  /** Extensions, programmes, géométrie, FBO (aussi appelé après une perte de contexte). */
  function construire() {
    formats = detecterFormats();
    if (!formats) throw new Error('aucun format flottant rendable');
    lineaire = formats.lineaire;
    creerQuad();
    creerProgrammes();
    velocite = densite = pression = divergence = rotationnel = null;
    initFBOs(resolutionCourante || 256);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.clearColor(FOND[0], FOND[1], FOND[2], 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
  }

  function init(cible, opts) {
    window.FluidReady = false;
    try {
      canvas = cible || document.getElementById('scene');
      options = opts || {};
      econome = detecterEconome();
      gl = canvas.getContext('webgl2', ATTRIBUTS_CONTEXTE);
      if (!gl) throw new Error('WebGL 2 indisponible');
      if (!ecouteursPoses) {
        ecouteursPoses = true;
        canvas.addEventListener('webglcontextlost', e => {
          e.preventDefault();
          window.FluidReady = false;
        });
        canvas.addEventListener('webglcontextrestored', () => {
          try { construire(); window.FluidReady = true; } catch (err) { window.FluidReady = false; }
        });
      }
      resize();
      construire();
      window.FluidReady = true;
      return true;
    } catch (err) {
      // Repli silencieux : l'interface reste utilisable, fond CSS noir
      console.warn('Onde liquide — moteur fluide désactivé : ' + err.message);
      window.FluidReady = false;
      return false;
    }
  }

  window.Fluid = { init, update, render, resize, capture };
})();

/* ==================== AMORÇAGE ==================== */
(function demarrer() {
  const canvas = $('#scene');
  Fluid.init(canvas, { dprMax: DPR_MAX });
  Audio.assurerContexte();   // contexte créé en suspens, repris au premier geste
  Analyse.init(Audio.analyser);
  UI.init();
  UI.appliquerRendu();
  Interactions.init(canvas);
  Onboarding.init();

  // Pointeur actif : garde l'injection allumée pendant le contact
  canvas.addEventListener('pointerdown', () => { Interactions.pointActif = true; });
  window.addEventListener('pointerup',   () => { Interactions.pointActif = false; });
  canvas.addEventListener('pointercancel', () => { Interactions.pointActif = false; });

  // Boutons capture / partage
  $('#btn-capture').addEventListener('click', () => Capture.png());
  $('#btn-webm').addEventListener('click',    () => Capture.webm());
  $('#btn-partage').addEventListener('click', () => Capture.partage());

  // Redimensionnement (debounce léger)
  let minuteur;
  window.addEventListener('resize', () => {
    clearTimeout(minuteur);
    minuteur = setTimeout(() => Fluid.resize(), 120);
  });

  Boucle.demarrer();
})();
</script>
</body>
